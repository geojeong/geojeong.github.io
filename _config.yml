# Site settings
title:          정상혁 깃헙 페이지
description:    "정상혁 한국어 깃헙 페이지"
url:            https://geojeong.github.io/

# Author
author:
  name:         Sanghyeok Jeong
  email:        geojeong02@gmail.com
  url:          https://geojeong.github.io/

# Build settings
markdown:       kramdown

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# Related posts settings
related_posts_section:
  max_count:        5
  min_common_tags:  2

# Links to social media
social:
  email: geojeong02@gmail.com
  github: https://github.com/geojeong
